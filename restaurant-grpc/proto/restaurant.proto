
syntax = "proto3";

package restaurant;

service RestaurantService {
  rpc GetMenu (Empty) returns (MenuResponse);
  rpc CheckAvailability (AvailabilityRequest)
      returns (AvailabilityResponse);
}

service BillingService {
  rpc CalculateBill (BillRequest) returns (BillResponse);
}

service OrderService {
  rpc PlaceOrder (PlaceOrderRequest) returns (OrderResponse);
  rpc GetOrder (GetOrderRequest) returns (OrderResponse);
}

message Empty {}

message MenuItem {
  string id = 1;
  string name = 2;
  double price = 3;
  bool available = 4;
}

message MenuResponse {
  repeated MenuItem items = 1;
}

message AvailabilityRequest {
  string item_id = 1;
  int32 quantity = 2;
}

message AvailabilityResponse {
  bool available = 1;
  string message = 2;
}

message OrderItem {
  string item_id = 1;
  int32 quantity = 2;
}

message BillRequest {
  repeated OrderItem items = 1;
}

message BillResponse {
  double subtotal = 1;
  double tax = 2;
  double total = 3;
  string currency = 4;
}

message PlaceOrderRequest {
  string customer_name = 1;
  repeated OrderItem items = 2;
}

message GetOrderRequest {
  string order_id = 1;
}

message OrderResponse {
  string order_id = 1;
  string customer_name = 2;
  string status = 3;
  BillResponse bill = 4;
}

